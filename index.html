<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI Trading — Đăng ký tham dự</title>
  <link rel="stylesheet" href="styles.css"/>
  <script>
// --- Simple Pixel + GA bootstrap with localStorage config ---
// Set once via /config.html and it persists on the domain.
(function(){
  const PIXEL_ID = localStorage.getItem('PIXEL_ID');
  const GA_ID = localStorage.getItem('GA_ID');

  // Meta Pixel
  if (PIXEL_ID) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', PIXEL_ID);
    fbq('track','PageView');
    window.__fbqReady = true;
  }

  // GA4
  if (GA_ID) {
    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','https://www.googletagmanager.com/gtag/js?id='+GA_ID,'ga_g');
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', GA_ID);
    window.__gaReady = true;
  }
})();
</script>
</head>
<body>
  <div class="container">
    <div class="grid">
      <div class="card">
        <h1 class="h1">AI TRADING — Ứng dụng AI vào giao dịch tài chính</h1>
        <p class="lead">Đăng ký nhận lịch học, tài liệu & link Zoom.</p>
      </div>
      <div class="card" id="reg">
        <h3>Giữ chỗ miễn phí</h3>
        <form id="regForm">
          <label>Họ và tên<input class="input" name="name" required></label>
          <label>Số điện thoại<input class="input" name="phone" required></label>
          <label>Email<input class="input" type="email" name="email"></label>
          <button class="btn" type="submit" style="margin-top:10px;width:100%">Đăng ký ngay</button>
          <div id="msg" class="lead" style="margin-top:8px"></div>
        </form>
        <div style="margin-top:8px"><a class="btn alt" href="config.html">Cấu hình Pixel & GA</a></div>
      </div>
    </div>
  </div>
<script>
document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(this).entries());

  // Pixel Lead
  try { if (window.__fbqReady && window.fbq) fbq('track','Lead',{content_name:'AI Trading Landing'}); } catch(e){}

  // GA4 event
  try { if (window.__gaReady && window.gtag) gtag('event','lead',{method:'form_submit'}); } catch(e){}

  // Redirect
  location.href = 'thank-you.html?name=' + encodeURIComponent(data.name||'');
});
</script>
</body>
</html>
